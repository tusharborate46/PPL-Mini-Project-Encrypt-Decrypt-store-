<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Messenger</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Include CryptoJS for client-side encryption -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>


    <!-- Login/Setup Screen -->
    <div class="container" id="login-container">
        <header>
            <h1><span class="icon">💬</span> Secure Chat</h1>
            <p class="subtitle">End-to-End Encrypted Room</p>
        </header>
        <main class="glass-panel">
            <div class="form-group">
                <label for="display-name">Display Name</label>
                <input type="text" id="display-name" placeholder="E.g. Alice">
            </div>
            <div class="form-group">
                <label for="room-passphrase">Room Passphrase</label>
                <input type="password" id="room-passphrase" placeholder="Shared secret passphrase">
            </div>
            <button id="btn-join" class="primary-btn">Join Chat</button>
            <div style="margin-top: 1rem; text-align: center;">
                <button id="btn-admin-login" class="secondary-btn">Join as Admin (No Key)</button>
            </div>
        </main>
    </div>

    <!-- Main Chat Interface -->
    <div class="chat-container hidden" id="chat-container">
        <header class="chat-header">
            <div>
                <h2 id="room-title">Secure Room</h2>
                <span id="user-info"></span>
            </div>
            <button id="btn-leave" class="secondary-btn small-btn">Leave</button>
        </header>
        
        <main class="chat-main" id="chat-messages">
            <!-- Messages will be injected here -->
        </main>
        
        <footer class="chat-footer" id="chat-input-area">
            <input type="text" id="chat-input" placeholder="Type an encrypted message..." autocomplete="off">
            <button id="btn-send" class="primary-btn send-btn">Send</button>
        </footer>
    </div>

    <div id="toast-container"></div>

    <script src="script.js"></script>
</body>
</html>
